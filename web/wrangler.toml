name = "interviewdrill"
main = "src/index.ts"
compatibility_date = "2026-09-16"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "interviewdrill"
database_id = "56d0b037-989b-4eec-8dc2-47eb704ab6e8"

[vars]
# Grading model. Default needs no API key: Cloudflare Workers AI (free daily allowance).
# LLM = "workers-ai" | "anthropic" (needs: wrangler secret put ANTHROPIC_API_KEY) | "none".
# With "none" (or no key) you grade yourself against the reference.
LLM = "workers-ai"
# Tried in order; if one is refused or the daily allowance is used up, the next one answers.
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/meta/llama-3.1-8b-instruct-fast"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
DAILY_CAP = "200"
# Cloudflare Access application protecting this Worker's hostname (fail closed if empty).
TEAM_DOMAIN = "https://wispy-truth-ec38.cloudflareaccess.com"  # https://<team>.cloudflareaccess.com
ACCESS_AUD = "b72e1ca3e29b1982e7de2b36da53acad9fdc315f1d2461e758221177c4f9a2fe"   # application AUD tag
# CLI sync (problem/bug progress): an Access service token allowed by the application's policy.
SYNC_CLIENT_ID = ""  # the token's Client ID; empty disables machine access
# SYNC_USER = "..."       # your Access email: the user the CLI acts as
